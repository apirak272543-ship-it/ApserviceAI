name: NOVA Agent

on:
  workflow_dispatch:
  repository_dispatch:
    types: [nova_task]
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: nova-agent-queue
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install runner dependencies
        run: python -m pip install --disable-pip-version-check -q -r runner/requirements.txt

      - name: Process one NOVA task
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ github.token }}
          WORKSPACE: ${{ github.workspace }}
          RUN_ONCE: 'true'
          GEMINI_MODEL: gemini-3.6-flash
          GEMINI_MODELS: gemini-3.6-flash,gemini-3.8-flash,gemini-2.5-flash,gemini-2.0-flash
        run: python runner/agent_runner.py
